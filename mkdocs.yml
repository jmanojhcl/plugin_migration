#Project Information
site_name: HCLSoftware Plugin Documentation
site_url: https://help.hcl-software.com/plugins/latest/
site_description: >
  HCLSoftware plugins documentation site.

# Theme Configuration
theme:
  name: material
  #logo: assets/images/logos/dx/dx_logo.png
  language: en
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - navigation.instant
    - navigation.prune
    - search.highlight
    - search.share
    - search.suggest
    - navigation.prune
    - content.code.copy
    - content.action.edit
  custom_dir: theme_overrides/
  icon:
    repo: fontawesome/brands/github
    edit: fontawesome/regular/pen-to-square
  font:
    text: Roboto
    code: Roboto Mono
  favicon: assets/images/favicons/hcl/favicon.png
  # Static files
  static_templates:
    - 404.html
    - partials/footer.html

# Markdown Extensions
markdown_extensions:
  - pymdownx.highlight:
      use_pygments: true
      pygments_lang_class: true
      auto_title: false
      linenums: false
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - pymdownx.tabbed:
      alternate_style: true 
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      title: On this page

# Copyright
copyright: >-
  Copyright &copy; 2019-2025, HCL Technologies Limited - 
  <a href="#__consent">Change cookie settings</a>

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/HCL-TECH-SOFTWARE
  version:
    provider: mike
  analytics: 
    provider: custom
    property: G-7LF0XY95M1

# Repository
repo_url: https://github.com/urbancode/IBM-UCx-PLUGIN-DOCS
repo_name: urbancode/IBM-UCx-PLUGIN-DOCS
edit_uri: edit/main/docs

# Customization
extra_css:
  - assets/stylesheets/style.css


extra_javascript:
  - assets/javascripts/mail.js
  - javascripts/plugin-filter.js

plugins:
#Use the awsesome-pages plugin if your docs is small and will not grow big (1000s of files). This plugin uses the folder structure within 'docs' to generate the TOC. Each sub-folder consists of a .pages file that lists the topics. For the ease of flexibility to maintain the TOC, comment out the awesome-pages plugin and use the nav entry at the bottom. Reach out to us for more information.
  # - awesome-pages
  - search
  - tags
  - mike:
      canonical_version: latest
      alias_type: redirect
  - git-revision-date-localized:
      fallback_to_build_date: true
  # - git-revision-date-localized:
  #     type: date
  # - meta:
  #     meta_file: .meta.yml

